[package]
name = "thk-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "trihienkun-laucher"

[lib]
name = "thk_app"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "trihienkun-laucher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
thk-core.workspace = true
thk-auth.workspace = true
thk-java.workspace = true
thk-launcher.workspace = true
thk-mods.workspace = true
thk-server.workspace = true
thk-network.workspace = true
thk-renderer3d.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
egui_commonmark.workspace = true
glam.workspace = true
image.workspace = true
rodio.workspace = true
sysinfo.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe.workspace = true
rfd.workspace = true
tray-icon.workspace = true
open.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity", "clipboard", "default_fonts", "wgpu", "links", "persistence"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
rusqlite.workspace = true
zip.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
