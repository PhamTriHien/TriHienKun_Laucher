name: Build & Release TriHienKun Laucher

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Format, Clippy & Test Gate (${{ matrix.os }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI & Audio System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify Rustfmt Formatting
        run: cargo fmt --all -- --check

      - name: Run Workspace Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit & Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --test-threads=1

      - name: Run Workspace Unit, Integration & UI Bounds Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --test-threads=1 --skip views::servers::visual_tests::visual_

  build-matrix:
    name: Build (${{ matrix.asset_name }})
    needs: quality-gate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: trihienkun-laucher.exe
            asset_name: trihienkun-laucher-windows-x64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p thk-app

      - name: Stage Release Asset & Compute SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256

  build-android:
    name: Build (trihienkun-laucher-android-arm64.apk)
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Provision Android SDK 35, Build-Tools 35.0.0 & NDK 28.2.13676358
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $SdkRoot = @(
              $env:ANDROID_HOME,
              $env:ANDROID_SDK_ROOT,
              "C:\Android\android-sdk"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $SdkRoot) {
              $SdkRoot = Join-Path $env:RUNNER_TEMP "android-sdk"
              New-Item -ItemType Directory -Force -Path $SdkRoot | Out-Null
          }

          function Find-SdkManager([string]$Root) {
              $cmdRoot = Join-Path $Root "cmdline-tools"
              if (-not (Test-Path $cmdRoot)) { return $null }
              $latestBat = Join-Path $cmdRoot "latest\bin\sdkmanager.bat"
              if (Test-Path $latestBat) { return $latestBat }
              return Get-ChildItem -Path $cmdRoot -Directory |
                  Sort-Object {
                      $v = 0.0
                      if ([double]::TryParse($_.Name, [System.Globalization.NumberStyles]::Float, [System.Globalization.CultureInfo]::InvariantCulture, [ref]$v)) { $v } else { -1.0 }
                  } -Descending |
                  ForEach-Object { Join-Path $_.FullName "bin\sdkmanager.bat" } |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
          }

          $SdkManager = Find-SdkManager $SdkRoot
          if (-not $SdkManager) {
              $ZipUrl = "https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip"
              $ZipPath = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
              $ExtractDir = Join-Path $env:RUNNER_TEMP "cmdline-tools-extract"
              Write-Host "Downloading Android command-line tools from $ZipUrl..."
              Invoke-WebRequest -Uri $ZipUrl -OutFile $ZipPath
              if (Test-Path $ExtractDir) { Remove-Item -Recurse -Force $ExtractDir }
              Expand-Archive -LiteralPath $ZipPath -DestinationPath $ExtractDir -Force
              $TargetLatest = Join-Path $SdkRoot "cmdline-tools\latest"
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $TargetLatest) | Out-Null
              if (Test-Path $TargetLatest) { Remove-Item -Recurse -Force $TargetLatest }
              Move-Item -Path (Join-Path $ExtractDir "cmdline-tools") -Destination $TargetLatest
              $SdkManager = Join-Path $TargetLatest "bin\sdkmanager.bat"
          }
          if (-not (Test-Path $SdkManager)) {
              throw "sdkmanager.bat not found at $SdkManager"
          }
          Write-Host "Using sdkmanager: $SdkManager (SDK root: $SdkRoot)"

          $PlatformDir = Join-Path $SdkRoot "platforms\android-35"
          $BuildToolsDir = Join-Path $SdkRoot "build-tools\35.0.0"
          $NdkDir = Join-Path $SdkRoot "ndk\28.2.13676358"
          $ClangCheck = Join-Path $NdkDir "toolchains\llvm\prebuilt\windows-x86_64\bin\aarch64-linux-android28-clang.cmd"

          $MissingPackages = @()
          if (-not (Test-Path (Join-Path $PlatformDir "android.jar"))) {
              $MissingPackages += "platforms;android-35"
          }
          if (-not (Test-Path (Join-Path $BuildToolsDir "aapt2.exe"))) {
              $MissingPackages += "build-tools;35.0.0"
          }
          if (-not (Test-Path $ClangCheck)) {
              $MissingPackages += "ndk;28.2.13676358"
          }

          if ($MissingPackages.Count -gt 0) {
              Write-Host "Installing missing Android SDK packages: $($MissingPackages -join ', ')"
              $prevEap = $ErrorActionPreference
              $ErrorActionPreference = "Continue"
              1..60 | ForEach-Object { "y" } | & $SdkManager "--sdk_root=$SdkRoot" --licenses *> $null
              $ErrorActionPreference = $prevEap
              $global:LASTEXITCODE = 0
              & $SdkManager "--sdk_root=$SdkRoot" --install @MissingPackages
              if ($LASTEXITCODE -ne 0) {
                  throw "sdkmanager --install failed with exit code $LASTEXITCODE"
              }
          } else {
              Write-Host "All required Android SDK/NDK components are already present."
          }

          foreach ($RequiredFile in @(
              (Join-Path $PlatformDir "android.jar"),
              (Join-Path $BuildToolsDir "aapt2.exe"),
              $ClangCheck
          )) {
              if (-not (Test-Path $RequiredFile)) {
                  throw "Required Android toolchain file missing after provisioning: $RequiredFile"
              }
          }

          @(
              "ANDROID_HOME=$SdkRoot",
              "ANDROID_SDK_ROOT=$SdkRoot",
              "ANDROID_NDK_HOME=$NdkDir",
              "ANDROID_BUILD_TOOLS_DIR=$BuildToolsDir",
              "ANDROID_PLATFORM_DIR=$PlatformDir"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      - name: Run Android Cross-Target Clippy (-D warnings)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $NdkDir = $env:ANDROID_NDK_HOME
          if (-not $NdkDir -or -not (Test-Path $NdkDir)) {
              throw "ANDROID_NDK_HOME is missing or invalid: '$NdkDir'"
          }
          $NdkBin = Join-Path $NdkDir "toolchains\llvm\prebuilt\windows-x86_64\bin"
          $Clang = Join-Path $NdkBin "aarch64-linux-android28-clang.cmd"
          $ClangPP = Join-Path $NdkBin "aarch64-linux-android28-clang++.cmd"
          $LlvmAr = Join-Path $NdkBin "llvm-ar.exe"
          $env:CC_aarch64_linux_android = $Clang
          $env:CXX_aarch64_linux_android = $ClangPP
          $env:AR_aarch64_linux_android = $LlvmAr
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $Clang
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS = "-C link-arg=-Wl,-z,max-page-size=16384"
          & cargo clippy --target aarch64-linux-android --lib -p thk-app -- -D warnings
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Build 16 KB Page-Aligned Release APK
        shell: pwsh
        run: ./scripts/build-android-apk.ps1 -Profile release

      - name: Stage Android Release Asset & Compute SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/android/trihienkun-laucher-arm64-v8a-release.apk" "dist/trihienkun-laucher-android-arm64.apk"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "trihienkun-laucher-android-arm64.apk" > "trihienkun-laucher-android-arm64.apk.sha256"
          else
            shasum -a 256 "trihienkun-laucher-android-arm64.apk" > "trihienkun-laucher-android-arm64.apk.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-trihienkun-laucher-android-arm64.apk
          path: |
            dist/trihienkun-laucher-android-arm64.apk
            dist/trihienkun-laucher-android-arm64.apk.sha256

  publish-release:
    name: Publish GitHub Release & SHA256SUMS.txt
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble Unified SHA256SUMS.txt
        run: |
          cd artifacts
          LC_ALL=C sort *.sha256 > SHA256SUMS.txt && rm -f *.sha256 && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/trihienkun-laucher-*
            artifacts/SHA256SUMS.txt
