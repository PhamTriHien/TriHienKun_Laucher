name: Build & Release TriHienKun Laucher

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Format, Clippy & Test Gate (${{ matrix.os }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI & Audio System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify Rustfmt Formatting
        run: cargo fmt --all -- --check

      - name: Run Workspace Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit & Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --test-threads=1

      - name: Run Workspace Unit, Integration & UI Bounds Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --test-threads=1 --skip views::servers::visual_tests::visual_

  build-matrix:
    name: Build (${{ matrix.asset_name }})
    needs: quality-gate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: trihienkun-laucher.exe
            asset_name: trihienkun-laucher-windows-x64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: trihienkun-laucher
            asset_name: trihienkun-laucher-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p thk-app

      - name: Stage Release Asset & Compute SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256

  build-android:
    name: Build (trihienkun-laucher-android-arm64.apk)
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35, Build-Tools 35.0.0 & NDK 28.2.13676358
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      - name: Run Android Cross-Target Clippy (-D warnings)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $SdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $NdkDir = Get-ChildItem -Path (Join-Path $SdkRoot "ndk") -Directory |
              Sort-Object Name -Descending |
              Select-Object -ExpandProperty FullName -First 1
          if (-not $NdkDir) {
              throw "Android NDK not found under $SdkRoot\ndk."
          }
          $NdkBin = Join-Path $NdkDir "toolchains\llvm\prebuilt\windows-x86_64\bin"
          $Clang = Join-Path $NdkBin "aarch64-linux-android28-clang.cmd"
          $ClangPP = Join-Path $NdkBin "aarch64-linux-android28-clang++.cmd"
          $LlvmAr = Join-Path $NdkBin "llvm-ar.exe"
          $env:ANDROID_HOME = $SdkRoot
          $env:ANDROID_NDK_HOME = $NdkDir
          $env:CC_aarch64_linux_android = $Clang
          $env:CXX_aarch64_linux_android = $ClangPP
          $env:AR_aarch64_linux_android = $LlvmAr
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $Clang
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS = "-C link-arg=-Wl,-z,max-page-size=16384"
          & cargo clippy --target aarch64-linux-android --lib -p thk-app -- -D warnings
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Build 16 KB Page-Aligned Release APK
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-android-apk.ps1 -Profile release

      - name: Stage Android Release Asset & Compute SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/android/trihienkun-laucher-arm64-v8a-release.apk" "dist/trihienkun-laucher-android-arm64.apk"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "trihienkun-laucher-android-arm64.apk" > "trihienkun-laucher-android-arm64.apk.sha256"
          else
            shasum -a 256 "trihienkun-laucher-android-arm64.apk" > "trihienkun-laucher-android-arm64.apk.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-trihienkun-laucher-android-arm64.apk
          path: |
            dist/trihienkun-laucher-android-arm64.apk
            dist/trihienkun-laucher-android-arm64.apk.sha256

  publish-release:
    name: Publish GitHub Release & SHA256SUMS.txt
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble Unified SHA256SUMS.txt
        run: |
          cd artifacts
          LC_ALL=C sort *.sha256 > SHA256SUMS.txt && rm -f *.sha256 && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/trihienkun-laucher-*
            artifacts/SHA256SUMS.txt
